<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#7c3aed" />
  <title>Desejos – Tayna & Guilherme</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #7c3aed;
      --primary-dark: #5b21b6;
      --secondary: #ec4899;
      --accent: #14b8a6;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --bg: #faf5ff;
      --card: #ffffff;
      --text: #1e1b4b;
      --text-muted: #6b7280;
      --border: #e9d5ff;
      --shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.15);
      --radius: 20px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: 'Nunito', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    /* ========== LOGIN ========== */
    #login-screen {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(160deg, #fdf4ff 0%, #f3e8ff 40%, #ede9fe 100%);
      position: relative;
      overflow: hidden;
    }

    #login-screen::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(236,72,153,0.15) 0%, transparent 70%);
      top: -80px;
      right: -80px;
      border-radius: 50%;
    }

    #login-screen::after {
      content: '';
      position: absolute;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(124,58,237,0.12) 0%, transparent 70%);
      bottom: -60px;
      left: -60px;
      border-radius: 50%;
    }

    .login-card {
      background: var(--card);
      border-radius: 28px;
      padding: 36px 28px;
      width: 100%;
      max-width: 380px;
      box-shadow: var(--shadow);
      position: relative;
      z-index: 1;
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }

    .logo p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .hearts {
      font-size: 1.6rem;
      margin-bottom: 8px;
      letter-spacing: 4px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--text);
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 14px;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #faf5ff;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
      background: white;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      font-family: inherit;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
      position: relative;
      overflow: hidden;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 8px 20px -4px rgba(124, 58, 237, 0.45);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: white;
      color: var(--primary);
      border: 2px solid var(--primary);
    }

    .btn-success {
      background: linear-gradient(135deg, var(--success), #059669);
      color: white;
      box-shadow: 0 8px 20px -4px rgba(16, 185, 129, 0.4);
    }

    .btn-danger {
      background: linear-gradient(135deg, var(--danger), #dc2626);
      color: white;
    }

    .btn-accent {
      background: linear-gradient(135deg, var(--accent), #0d9488);
      color: white;
      box-shadow: 0 8px 20px -4px rgba(20, 184, 166, 0.4);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 2px solid var(--border);
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.9rem;
      text-align: center;
      margin-top: 12px;
      min-height: 22px;
    }

    /* ========== APP SHELL ========== */
    #app {
      display: none;
      flex-direction: column;
      min-height: 100dvh;
      padding-bottom: calc(70px + var(--safe-bottom));
    }

    .header {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      padding: 16px 20px 20px;
      border-radius: 0 0 28px 28px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
      border: 2px solid rgba(255,255,255,0.5);
    }

    .header-user strong {
      font-size: 1.1rem;
    }

    .logout-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scoreboard {
      display: flex;
      background: rgba(255,255,255,0.18);
      border-radius: 16px;
      padding: 12px 8px;
      backdrop-filter: blur(8px);
    }

    .score-item {
      flex: 1;
      text-align: center;
      position: relative;
    }

    .score-item:first-child::after {
      content: '';
      position: absolute;
      right: 0;
      top: 15%;
      height: 70%;
      width: 1px;
      background: rgba(255,255,255,0.3);
    }

    .score-label {
      font-size: 0.75rem;
      opacity: 0.85;
      margin-bottom: 2px;
    }

    .score-value {
      font-size: 1.6rem;
      font-weight: 800;
      line-height: 1.1;
    }

    .score-diff {
      font-size: 0.7rem;
      opacity: 0.8;
      margin-top: 2px;
    }

    /* ========== CONTENT ========== */
    .content {
      flex: 1;
      padding: 20px 16px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(233, 213, 255, 0.6);
    }

    .card-title {
      font-weight: 800;
      font-size: 1.05rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .badge-success { background: #d1fae5; color: #065f46; }
    .badge-warning { background: #fef3c7; color: #92400e; }
    .badge-danger { background: #fee2e2; color: #991b1b; }
    .badge-info { background: #e0e7ff; color: #3730a3; }
    .badge-pink { background: #fce7f3; color: #9d174d; }

    /* Active desire */
    .active-card {
      background: linear-gradient(145deg, #fdf4ff, #f5f3ff);
      border: 2px solid var(--primary);
      position: relative;
      overflow: hidden;
    }

    .active-card::before {
      content: '✨';
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 1.4rem;
      opacity: 0.5;
    }

    .desire-text {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.45;
      margin: 12px 0 16px;
      color: var(--text);
    }

    .countdown {
      display: flex;
      align-items: center;
      gap: 8px;
      background: white;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .countdown.urgent {
      color: var(--danger);
      background: #fef2f2;
    }

    .countdown-icon {
      font-size: 1.2rem;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 28px 16px;
      color: var(--text-muted);
    }

    .empty-state .icon {
      font-size: 2.8rem;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    /* Progress */
    .progress-bar {
      height: 10px;
      background: #ede9fe;
      border-radius: 10px;
      overflow: hidden;
      margin: 8px 0 4px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Desire list item */
    .desire-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .desire-item:last-child {
      border-bottom: none;
    }

    .desire-item .num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ede9fe;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .desire-item .text {
      flex: 1;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    /* Pending confirm */
    .pending-item {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .pending-item .who {
      font-size: 0.8rem;
      font-weight: 700;
      color: #c2410c;
      margin-bottom: 6px;
    }

    .pending-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .pending-actions .btn {
      flex: 1;
      padding: 12px;
      font-size: 0.95rem;
    }

    /* Bottom nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid var(--border);
      display: flex;
      padding: 8px 0 calc(8px + var(--safe-bottom));
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      transition: color 0.2s;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-item .icon {
      font-size: 1.4rem;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(30, 27, 75, 0.55);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s, visibility 0.25s;
    }

    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: white;
      border-radius: 28px 28px 0 0;
      padding: 24px 20px calc(24px + var(--safe-bottom));
      width: 100%;
      max-width: 480px;
      max-height: 85dvh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .modal-overlay.show .modal {
      transform: translateY(0);
    }

    .modal-handle {
      width: 40px;
      height: 4px;
      background: #d1d5db;
      border-radius: 4px;
      margin: 0 auto 18px;
    }

    .modal h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      margin-bottom: 8px;
      text-align: center;
    }

    .modal p.sub {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 14px;
      border: 2px solid var(--border);
      border-radius: 14px;
      font-family: inherit;
      font-size: 1rem;
      resize: vertical;
      margin-bottom: 16px;
      background: #faf5ff;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
    }

    .char-count {
      text-align: right;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: -10px;
      margin-bottom: 12px;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #1e1b4b;
      color: white;
      padding: 14px 22px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      z-index: 300;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }

    /* Loading */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 400;
      opacity: 0;
      visibility: hidden;
      transition: 0.2s;
    }

    .loading-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #ede9fe;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* History */
    .history-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      align-items: flex-start;
    }

    .history-item:last-child { border-bottom: none; }

    .history-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .history-icon.ok { background: #d1fae5; }
    .history-icon.fail { background: #fee2e2; }

    .history-content {
      flex: 1;
    }

    .history-content .text {
      font-size: 0.9rem;
      line-height: 1.35;
      margin-bottom: 4px;
    }

    .history-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Section headers */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-header h2 {
      font-size: 1.1rem;
      font-weight: 800;
    }

    /* Utils */
    .hidden { display: none !important; }
    .mt-12 { margin-top: 12px; }
    .mt-16 { margin-top: 16px; }
    .mb-8 { margin-bottom: 8px; }
    .text-center { text-align: center; }
    .flex-gap { display: flex; gap: 10px; }
    .flex-gap .btn { flex: 1; }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-in {
      animation: fadeInUp 0.35s ease forwards;
    }

    /* Winner banner */
    .winner-banner {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      border: 2px solid #f59e0b;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      margin-bottom: 16px;
    }

    .winner-banner .title {
      font-weight: 800;
      color: #92400e;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-card animate-in">
      <div class="logo">
        <div class="hearts">💜 ✨ 💜</div>
        <h1>Desejos</h1>
        <p>Tayna & Guilherme</p>
      </div>
      <div class="form-group">
        <label for="username">Login</label>
        <input type="text" id="username" placeholder="Seu nome" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="Sua senha" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary" id="btn-login" onclick="doLogin()">
        Entrar no jogo
      </button>
      <div class="error-msg" id="login-error"></div>
    </div>
  </div>

  <!-- APP -->
  <div id="app">
    <header class="header">
      <div class="header-top">
        <div class="header-user">
          <div class="avatar" id="user-avatar">T</div>
          <div>
            <strong id="user-name">Tayna</strong>
            <div style="font-size:0.75rem;opacity:0.85" id="user-role">Jogador</div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()" title="Sair">⎋</button>
      </div>
      <div class="scoreboard">
        <div class="score-item">
          <div class="score-label" id="score-label-me">Você</div>
          <div class="score-value" id="score-me">0</div>
          <div class="score-diff" id="score-diff-me"></div>
        </div>
        <div class="score-item">
          <div class="score-label" id="score-label-other">Parceiro(a)</div>
          <div class="score-value" id="score-other">0</div>
          <div class="score-diff" id="score-diff-other"></div>
        </div>
      </div>
    </header>

    <main class="content" id="main-content">
      <!-- Views will be injected here -->
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-view="home" onclick="switchView('home')">
        <span class="icon">🏠</span>
        Início
      </button>
      <button class="nav-item" data-view="write" onclick="switchView('write')">
        <span class="icon">✍️</span>
        Escrever
      </button>
      <button class="nav-item" data-view="pending" onclick="switchView('pending')">
        <span class="icon">🔔</span>
        Confirmar
      </button>
      <button class="nav-item" data-view="history" onclick="switchView('history')">
        <span class="icon">📜</span>
        Histórico
      </button>
    </nav>
  </div>

  <!-- Modal Add Desire -->
  <div class="modal-overlay" id="modal-add">
    <div class="modal">
      <div class="modal-handle"></div>
      <h3>Novo Desejo</h3>
      <p class="sub">Escreva um desejo que o outro deverá cumprir</p>
      <textarea id="new-desire-text" placeholder="Ex: Me leve para jantar em um lugar especial..." maxlength="300"></textarea>
      <div class="char-count"><span id="char-count">0</span>/300</div>
      <div class="flex-gap">
        <button class="btn btn-ghost" onclick="closeModal('modal-add')">Cancelar</button>
        <button class="btn btn-primary" id="btn-save-desire" onclick="saveDesire()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Loading -->
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
  </div>

  <script>
    // ========== CONFIG ==========
    const API_URL = 'https://699107e56279728b0153afac.mockapi.io/Game';
    const GAME_ID = '1';
    const DEADLINE_DAYS = 6;
    const POINTS_SUCCESS = 10;
    const POINTS_FAIL = -5;
    const MAX_DESIRES = 30;

    const CREDENTIALS = {
      tayna: { password: '12124800', name: 'Tayna', initial: 'T' },
      guilherme: { password: '105046', name: 'Guilherme', initial: 'G' }
    };

    // ========== STATE ==========
    let currentUser = null; // 'tayna' | 'guilherme'
    let game = null;
    let currentView = 'home';
    let countdownInterval = null;

    // ========== UTILS ==========
    function $(id) { return document.getElementById(id); }

    function showLoading(show = true) {
      $('loading').classList.toggle('show', show);
    }

    function toast(msg, type = '') {
      const el = $('toast');
      el.textContent = msg;
      el.className = 'toast show ' + type;
      setTimeout(() => el.classList.remove('show'), 2800);
    }

    function uuid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function formatDate(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    function daysLeft(deadline) {
      if (!deadline) return null;
      const now = Date.now();
      const diff = deadline - now;
      if (diff <= 0) return 0;
      return Math.ceil(diff / (1000 * 60 * 60 * 24));
    }

    function formatCountdown(deadline) {
      if (!deadline) return '—';
      const now = Date.now();
      let diff = deadline - now;
      if (diff <= 0) return 'Prazo esgotado!';
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      diff %= (1000 * 60 * 60 * 24);
      const hours = Math.floor(diff / (1000 * 60 * 60));
      const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      if (days > 0) return `${days}d ${hours}h ${mins}m`;
      return `${hours}h ${mins}m`;
    }

    function otherUser(user) {
      return user === 'tayna' ? 'guilherme' : 'tayna';
    }

    // ========== API ==========
    async function fetchGame() {
      const res = await fetch(`${API_URL}/${GAME_ID}`);
      if (!res.ok) throw new Error('Erro ao carregar jogo');
      return res.json();
    }

    async function saveGame(data) {
      const res = await fetch(`${API_URL}/${GAME_ID}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (!res.ok) throw new Error('Erro ao salvar');
      return res.json();
    }

    async function loadAndCheck() {
      showLoading(true);
      try {
        game = await fetchGame();
        // Ensure structure
        if (!game.players) game.players = { tayna: { score: 0 }, guilherme: { score: 0 } };
        if (!game.desires) game.desires = [];
        if (!game.active) game.active = { tayna: null, guilherme: null };

        // Check deadlines for both players (active or pending_confirm)
        let changed = false;
        const now = Date.now();
        for (const player of ['tayna', 'guilherme']) {
          const activeId = game.active[player];
          if (!activeId) continue;
          const desire = game.desires.find(d => d.id === activeId);
          if (!desire) {
            game.active[player] = null;
            changed = true;
            continue;
          }
          if ((desire.status === 'active' || desire.status === 'pending_confirm') && desire.deadline && now > desire.deadline) {
            // Failed by deadline
            desire.status = 'failed';
            desire.failedAt = now;
            desire.confirmRequestedBy = null;
            desire.confirmRequestedAt = null;
            game.players[player].score = (game.players[player].score || 0) + POINTS_FAIL;
            game.active[player] = null;
            changed = true;
          }
        }
        if (changed) {
          game = await saveGame(game);
        }
      } catch (e) {
        console.error(e);
        toast('Erro de conexão. Tente novamente.', 'error');
      } finally {
        showLoading(false);
      }
    }

    // ========== AUTH ==========
    function doLogin() {
      const user = $('username').value.trim().toLowerCase();
      const pass = $('password').value.trim();
      const errorEl = $('login-error');

      if (!CREDENTIALS[user] || CREDENTIALS[user].password !== pass) {
        errorEl.textContent = 'Login ou senha incorretos';
        return;
      }

      currentUser = user;
      localStorage.setItem('desejos_user', user);
      errorEl.textContent = '';
      startApp();
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem('desejos_user');
      if (countdownInterval) clearInterval(countdownInterval);
      $('app').style.display = 'none';
      $('login-screen').style.display = 'flex';
      $('username').value = '';
      $('password').value = '';
    }

    async function startApp() {
      $('login-screen').style.display = 'none';
      $('app').style.display = 'flex';
      $('user-name').textContent = CREDENTIALS[currentUser].name;
      $('user-avatar').textContent = CREDENTIALS[currentUser].initial;
      await loadAndCheck();
      updateScoreboard();
      switchView('home');
      // Auto refresh every 60s
      setInterval(async () => {
        await loadAndCheck();
        updateScoreboard();
        if (currentView === 'home' || currentView === 'pending') renderView();
      }, 60000);
    }

    // ========== SCOREBOARD ==========
    function updateScoreboard() {
      if (!game || !currentUser) return;
      const me = currentUser;
      const other = otherUser(me);
      const scoreMe = game.players[me]?.score || 0;
      const scoreOther = game.players[other]?.score || 0;

      $('score-me').textContent = scoreMe;
      $('score-other').textContent = scoreOther;
      $('score-label-me').textContent = CREDENTIALS[me].name;
      $('score-label-other').textContent = CREDENTIALS[other].name;

      const diff = scoreMe - scoreOther;
      if (diff > 0) {
        $('score-diff-me').textContent = `+${diff} à frente`;
        $('score-diff-other').textContent = '';
      } else if (diff < 0) {
        $('score-diff-me').textContent = '';
        $('score-diff-other').textContent = `+${Math.abs(diff)} à frente`;
      } else {
        $('score-diff-me').textContent = 'Empate';
        $('score-diff-other').textContent = 'Empate';
      }
    }

    // ========== VIEWS ==========
    function switchView(view) {
      currentView = view;
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });
      renderView();
    }

    function renderView() {
      if (!game) return;
      const content = $('main-content');
      content.innerHTML = '';

      if (currentView === 'home') renderHome(content);
      else if (currentView === 'write') renderWrite(content);
      else if (currentView === 'pending') renderPending(content);
      else if (currentView === 'history') renderHistory(content);
    }

    // ----- HOME -----
    function renderHome(container) {
      const me = currentUser;
      const other = otherUser(me);
      const myActiveId = game.active[me];
      const myActive = myActiveId ? game.desires.find(d => d.id === myActiveId) : null;

      // Written by other that are available
      const availableFromOther = game.desires.filter(d =>
        d.writer === other && d.status === 'available'
      );

      // Written by me
      const myWritten = game.desires.filter(d => d.writer === me);
      const completedByMe = game.desires.filter(d =>
        d.writer === other && (d.status === 'completed' || d.status === 'failed') &&
        (d.confirmedBy === me || d.failedAt)
      ); // roughly

      let html = '';

      // Winner check (if all done)
      const allMyDesiresDone = availableFromOther.length === 0 && !myActive;
      const totalFromOther = game.desires.filter(d => d.writer === other).length;
      if (totalFromOther >= MAX_DESIRES && allMyDesiresDone) {
        const scoreMe = game.players[me]?.score || 0;
        const scoreOther = game.players[other]?.score || 0;
        if (scoreMe > scoreOther) {
          html += `<div class="winner-banner animate-in"><div class="title">🏆 Você está vencendo!</div><div style="font-size:0.9rem;color:#92400e;margin-top:4px">Mais pontos no final</div></div>`;
        } else if (scoreOther > scoreMe) {
          html += `<div class="winner-banner animate-in"><div class="title">💪 Continue firme!</div><div style="font-size:0.9rem;color:#92400e;margin-top:4px">${CREDENTIALS[other].name} está na frente</div></div>`;
        }
      }

      // Active desire
      if (myActive) {
        const left = daysLeft(myActive.deadline);
        const isUrgent = left !== null && left <= 1;
        html += `
          <div class="card active-card animate-in">
            <div class="card-title">
              🎯 Seu desejo ativo
              <span class="badge ${isUrgent ? 'badge-danger' : 'badge-info'}">Em andamento</span>
            </div>
            <div class="desire-text">"${escapeHtml(myActive.text)}"</div>
            <div class="countdown ${isUrgent ? 'urgent' : ''}" id="countdown-box">
              <span class="countdown-icon">⏳</span>
              <span id="countdown-text">${formatCountdown(myActive.deadline)}</span>
            </div>
            <button class="btn btn-success" onclick="requestConfirm('${myActive.id}')">
              ✅ Marquei como cumprido
            </button>
          </div>
        `;
      } else {
        // Can reveal?
        if (availableFromOther.length > 0) {
          html += `
            <div class="card animate-in">
              <div class="empty-state">
                <div class="icon">🎲</div>
                <p>Você não tem desejo ativo.<br>Existem <strong>${availableFromOther.length}</strong> desejo(s) disponíveis da lista de ${CREDENTIALS[other].name}.</p>
                <button class="btn btn-accent" onclick="revealDesire()">
                  Revelar desejo aleatório
                </button>
              </div>
            </div>
          `;
        } else if (myWritten.length === 0 && availableFromOther.length === 0) {
          html += `
            <div class="card animate-in">
              <div class="empty-state">
                <div class="icon">💌</div>
                <p>Ainda não há desejos da outra pessoa.<br>Peça para ${CREDENTIALS[other].name} escrever alguns!</p>
              </div>
            </div>
          `;
        } else {
          html += `
            <div class="card animate-in">
              <div class="empty-state">
                <div class="icon">🎉</div>
                <p>Você já revelou todos os desejos disponíveis de ${CREDENTIALS[other].name}!</p>
              </div>
            </div>
          `;
        }
      }

      // Stats
      const writtenCount = myWritten.length;
      const availableCount = availableFromOther.length;
      const completedCount = game.desires.filter(d => d.writer === other && d.status === 'completed').length;
      const failedCount = game.desires.filter(d => d.writer === other && d.status === 'failed').length;

      html += `
        <div class="card animate-in" style="animation-delay:0.05s">
          <div class="card-title">📊 Seu progresso</div>
          <div class="progress-label">
            <span>Desejos escritos por você</span>
            <span>${writtenCount}/${MAX_DESIRES}</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width:${(writtenCount / MAX_DESIRES) * 100}%"></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px">
            <div style="background:#f0fdf4;border-radius:12px;padding:12px;text-align:center">
              <div style="font-size:1.4rem;font-weight:800;color:#059669">${completedCount}</div>
              <div style="font-size:0.75rem;color:#065f46">Cumpridos</div>
            </div>
            <div style="background:#fef2f2;border-radius:12px;padding:12px;text-align:center">
              <div style="font-size:1.4rem;font-weight:800;color:#dc2626">${failedCount}</div>
              <div style="font-size:0.75rem;color:#991b1b">Não cumpridos</div>
            </div>
          </div>
          <div style="margin-top:12px;font-size:0.85rem;color:var(--text-muted);text-align:center">
            Disponíveis para revelar: <strong>${availableCount}</strong>
          </div>
        </div>
      `;

      // Quick tip
      html += `
        <div class="card animate-in" style="animation-delay:0.1s;background:#f5f3ff">
          <div style="font-size:0.9rem;line-height:1.5;color:var(--text-muted)">
            <strong style="color:var(--primary)">Como funciona:</strong><br>
            1. Escreva desejos para o outro cumprir<br>
            2. Revele um desejo aleatório da lista do outro<br>
            3. Você tem <strong>6 dias</strong> para cumprir<br>
            4. Marque como cumprido → o outro confirma<br>
            5. +10 pts se cumprir | −5 pts se perder o prazo
          </div>
        </div>
      `;

      container.innerHTML = html;

      // Start countdown if active
      if (myActive && countdownInterval) clearInterval(countdownInterval);
      if (myActive) {
        countdownInterval = setInterval(() => {
          const el = $('countdown-text');
          if (el) el.textContent = formatCountdown(myActive.deadline);
          // If expired, reload
          if (Date.now() > myActive.deadline) {
            clearInterval(countdownInterval);
            loadAndCheck().then(() => {
              updateScoreboard();
              renderView();
            });
          }
        }, 30000);
      }
    }

    // ----- WRITE -----
    function renderWrite(container) {
      const myWritten = game.desires.filter(d => d.writer === currentUser);
      const count = myWritten.length;

      let html = `
        <div class="section-header">
          <h2>✍️ Seus desejos</h2>
          <span class="badge badge-pink">${count}/${MAX_DESIRES}</span>
        </div>
        <div class="progress-bar" style="margin-bottom:16px">
          <div class="progress-fill" style="width:${(count / MAX_DESIRES) * 100}%"></div>
        </div>
      `;

      if (count < MAX_DESIRES) {
        html += `
          <button class="btn btn-primary" style="margin-bottom:16px" onclick="openModal('modal-add')">
            + Adicionar desejo
          </button>
        `;
      } else {
        html += `<div class="card"><div class="empty-state"><p>Você já escreveu os 30 desejos! 🎉</p></div></div>`;
      }

      if (myWritten.length === 0) {
        html += `
          <div class="card">
            <div class="empty-state">
              <div class="icon">📝</div>
              <p>Você ainda não escreveu nenhum desejo.<br>Crie desejos que ${CREDENTIALS[otherUser(currentUser)].name} deverá cumprir.</p>
            </div>
          </div>
        `;
      } else {
        html += `<div class="card">`;
        myWritten.slice().reverse().forEach((d, i) => {
          let statusBadge = '';
          if (d.status === 'available') statusBadge = '<span class="badge badge-info">Disponível</span>';
          else if (d.status === 'active') statusBadge = '<span class="badge badge-warning">Ativo</span>';
          else if (d.status === 'pending_confirm') statusBadge = '<span class="badge badge-pink">Aguardando confirmação</span>';
          else if (d.status === 'completed') statusBadge = '<span class="badge badge-success">Cumprido</span>';
          else if (d.status === 'failed') statusBadge = '<span class="badge badge-danger">Não cumprido</span>';

          html += `
            <div class="desire-item">
              <div class="num">${myWritten.length - i}</div>
              <div class="text">
                ${escapeHtml(d.text)}
                <div style="margin-top:6px">${statusBadge}</div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }

      container.innerHTML = html;
    }

    // ----- PENDING -----
    function renderPending(container) {
      // Pending confirmations: desires that I wrote, status pending_confirm
      const pending = game.desires.filter(d =>
        d.writer === currentUser && d.status === 'pending_confirm'
      );

      let html = `
        <div class="section-header">
          <h2>🔔 Confirmações</h2>
          <span class="badge badge-warning">${pending.length}</span>
        </div>
      `;

      if (pending.length === 0) {
        html += `
          <div class="card">
            <div class="empty-state">
              <div class="icon">✅</div>
              <p>Nenhuma confirmação pendente no momento.</p>
            </div>
          </div>
        `;
      } else {
        pending.forEach(d => {
          const requester = d.confirmRequestedBy;
          html += `
            <div class="pending-item animate-in">
              <div class="who">${CREDENTIALS[requester]?.name || requester} diz que cumpriu:</div>
              <div class="desire-text" style="font-size:1.05rem;margin:8px 0">"${escapeHtml(d.text)}"</div>
              <div style="font-size:0.8rem;color:var(--text-muted)">Solicitado em ${formatDate(d.confirmRequestedAt)}</div>
              <div class="pending-actions">
                <button class="btn btn-danger" onclick="rejectConfirm('${d.id}')">Recusar</button>
                <button class="btn btn-success" onclick="approveConfirm('${d.id}')">Confirmar</button>
              </div>
            </div>
          `;
        });
      }

      // Also show if I have a pending that I requested (waiting)
      const myPending = game.desires.filter(d =>
        d.confirmRequestedBy === currentUser && d.status === 'pending_confirm'
      );
      if (myPending.length > 0) {
        html += `
          <div class="card mt-16">
            <div class="card-title">⏳ Aguardando confirmação</div>
            ${myPending.map(d => `
              <div style="padding:10px 0;border-bottom:1px solid var(--border)">
                <div style="font-weight:600">"${escapeHtml(d.text)}"</div>
                <div style="font-size:0.8rem;color:var(--text-muted);margin-top:4px">
                  Aguardando ${CREDENTIALS[d.writer]?.name}
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      container.innerHTML = html;
    }

    // ----- HISTORY -----
    function renderHistory(container) {
      const other = otherUser(currentUser);
      // Desires I had to fulfill (written by other)
      const myHistory = game.desires
        .filter(d => d.writer === other && (d.status === 'completed' || d.status === 'failed'))
        .sort((a, b) => (b.completedAt || b.failedAt || 0) - (a.completedAt || a.failedAt || 0));

      let html = `
        <div class="section-header">
          <h2>📜 Histórico</h2>
        </div>
      `;

      if (myHistory.length === 0) {
        html += `
          <div class="card">
            <div class="empty-state">
              <div class="icon">📭</div>
              <p>Nenhum desejo cumprido ou perdido ainda.</p>
            </div>
          </div>
        `;
      } else {
        html += `<div class="card">`;
        myHistory.forEach(d => {
          const ok = d.status === 'completed';
          html += `
            <div class="history-item">
              <div class="history-icon ${ok ? 'ok' : 'fail'}">${ok ? '✅' : '❌'}</div>
              <div class="history-content">
                <div class="text">${escapeHtml(d.text)}</div>
                <div class="history-meta">
                  ${ok ? `+${POINTS_SUCCESS} pts · ${formatDate(d.completedAt)}` : `${POINTS_FAIL} pts · ${formatDate(d.failedAt)}`}
                </div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }

      container.innerHTML = html;
    }

    // ========== ACTIONS ==========
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function openModal(id) {
      $(id).classList.add('show');
      if (id === 'modal-add') {
        $('new-desire-text').value = '';
        $('char-count').textContent = '0';
        setTimeout(() => $('new-desire-text').focus(), 300);
      }
    }

    function closeModal(id) {
      $(id).classList.remove('show');
    }

    // Char count
    document.addEventListener('input', (e) => {
      if (e.target.id === 'new-desire-text') {
        $('char-count').textContent = e.target.value.length;
      }
    });

    async function saveDesire() {
      const text = $('new-desire-text').value.trim();
      if (!text) {
        toast('Escreva o desejo', 'error');
        return;
      }
      if (text.length < 5) {
        toast('Desejo muito curto', 'error');
        return;
      }

      const myWritten = game.desires.filter(d => d.writer === currentUser);
      if (myWritten.length >= MAX_DESIRES) {
        toast('Limite de 30 desejos atingido', 'error');
        return;
      }

      showLoading(true);
      try {
        game.desires.push({
          id: uuid(),
          writer: currentUser,
          text: text,
          status: 'available',
          revealedAt: null,
          deadline: null,
          confirmRequestedBy: null,
          confirmRequestedAt: null,
          completedAt: null,
          failedAt: null
        });
        game = await saveGame(game);
        closeModal('modal-add');
        toast('Desejo salvo! 💜', 'success');
        renderView();
      } catch (e) {
        toast('Erro ao salvar', 'error');
      } finally {
        showLoading(false);
      }
    }

    async function revealDesire() {
      const other = otherUser(currentUser);
      const available = game.desires.filter(d => d.writer === other && d.status === 'available');
      if (available.length === 0) {
        toast('Nenhum desejo disponível', 'error');
        return;
      }
      if (game.active[currentUser]) {
        toast('Você já tem um desejo ativo', 'error');
        return;
      }

      // Random
      const chosen = available[Math.floor(Math.random() * available.length)];
      const now = Date.now();
      const deadline = now + (DEADLINE_DAYS * 24 * 60 * 60 * 1000);

      showLoading(true);
      try {
        chosen.status = 'active';
        chosen.revealedAt = now;
        chosen.deadline = deadline;
        game.active[currentUser] = chosen.id;
        game = await saveGame(game);
        toast('Desejo revelado! Você tem 6 dias ⏳', 'success');
        updateScoreboard();
        renderView();
      } catch (e) {
        toast('Erro ao revelar', 'error');
      } finally {
        showLoading(false);
      }
    }

    async function requestConfirm(desireId) {
      const desire = game.desires.find(d => d.id === desireId);
      if (!desire || desire.status !== 'active') {
        toast('Desejo inválido', 'error');
        return;
      }

      showLoading(true);
      try {
        desire.status = 'pending_confirm';
        desire.confirmRequestedBy = currentUser;
        desire.confirmRequestedAt = Date.now();
        // Keep active until confirmed or rejected
        game = await saveGame(game);
        toast('Aguardando confirmação do outro 💌', 'success');
        renderView();
        switchView('pending');
      } catch (e) {
        toast('Erro', 'error');
      } finally {
        showLoading(false);
      }
    }

    async function approveConfirm(desireId) {
      const desire = game.desires.find(d => d.id === desireId);
      if (!desire || desire.status !== 'pending_confirm') return;

      const fulfiller = desire.confirmRequestedBy;

      showLoading(true);
      try {
        desire.status = 'completed';
        desire.completedAt = Date.now();
        game.players[fulfiller].score = (game.players[fulfiller].score || 0) + POINTS_SUCCESS;
        game.active[fulfiller] = null;
        game = await saveGame(game);
        toast(`Confirmado! +${POINTS_SUCCESS} pontos para ${CREDENTIALS[fulfiller].name} 🎉`, 'success');
        updateScoreboard();
        renderView();
      } catch (e) {
        toast('Erro', 'error');
      } finally {
        showLoading(false);
      }
    }

    async function rejectConfirm(desireId) {
      const desire = game.desires.find(d => d.id === desireId);
      if (!desire || desire.status !== 'pending_confirm') return;

      const fulfiller = desire.confirmRequestedBy;

      showLoading(true);
      try {
        // Back to active (still has time)
        desire.status = 'active';
        desire.confirmRequestedBy = null;
        desire.confirmRequestedAt = null;
        game = await saveGame(game);
        toast('Confirmação recusada. O desejo continua ativo.', 'error');
        renderView();
      } catch (e) {
        toast('Erro', 'error');
      } finally {
        showLoading(false);
      }
    }

    // ========== INIT ==========
    document.addEventListener('DOMContentLoaded', () => {
      // Enter key on login
      $('password').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') doLogin();
      });
      $('username').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') $('password').focus();
      });

      // Auto login if saved
      const saved = localStorage.getItem('desejos_user');
      if (saved && CREDENTIALS[saved]) {
        currentUser = saved;
        startApp();
      }
    });

    // Close modal on overlay click
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeModal(overlay.id);
      });
    });
  </script>
</body>
</html>
