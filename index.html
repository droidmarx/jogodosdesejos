<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Desejos" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0610" />
  <meta name="description" content="Jogo de desejos para casal – Tayna & Guilherme" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>DESEJOS // Tayna & Guilherme</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Midnight Romance – casal */
      --primary: #f472b6;
      --primary-glow: rgba(244, 114, 182, 0.45);
      --secondary: #c084fc;
      --secondary-glow: rgba(192, 132, 252, 0.4);
      --accent: #fbbf24;
      --accent-glow: rgba(251, 191, 36, 0.35);
      --success: #4ade80;
      --danger: #fb7185;
      --warning: #fbbf24;
      --bg: #0a0610;
      --bg2: #140c1a;
      --card: #16101f;
      --card-border: rgba(244, 114, 182, 0.22);
      --text: #fdf2f8;
      --text-muted: #a89bb5;
      --border: rgba(244, 114, 182, 0.12);
      --shadow: 0 0 32px rgba(244, 114, 182, 0.12);
      --radius: 16px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(244, 114, 182, 0.16), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(192, 132, 252, 0.1), transparent),
        var(--bg);
    }

    /* ========== LOGIN ========== */
    #login-screen {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(ellipse 100% 80% at 50% 0%, rgba(244, 114, 182, 0.18), transparent 60%),
        radial-gradient(ellipse 80% 50% at 20% 100%, rgba(192, 132, 252, 0.12), transparent),
        #0a0610;
      position: relative;
      overflow: hidden;
    }

    #login-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(90deg, transparent 49%, rgba(251, 191, 36, 0.04) 50%, transparent 51%),
        linear-gradient(0deg, transparent 49%, rgba(244, 114, 182, 0.04) 50%, transparent 51%);
      background-size: 40px 40px;
      pointer-events: none;
      animation: gridPulse 8s ease-in-out infinite;
    }

    @keyframes gridPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }

    .login-card {
      background: rgba(22, 16, 31, 0.92);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 36px 28px;
      width: 100%;
      max-width: 380px;
      box-shadow: 
        0 0 40px rgba(244, 114, 182, 0.18),
        0 0 80px rgba(192, 132, 252, 0.1),
        inset 0 1px 0 rgba(255,255,255,0.05);
      position: relative;
      z-index: 1;
      backdrop-filter: blur(12px);
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #f472b6, #c084fc, #fbbf24);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
      animation: gradientShift 4s ease infinite;
      text-shadow: 0 0 30px var(--primary-glow);
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .logo p {
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .hearts {
      font-size: 1.5rem;
      margin-bottom: 10px;
      letter-spacing: 6px;
      filter: drop-shadow(0 0 8px var(--secondary-glow));
      animation: floatHeart 2.5s ease-in-out infinite;
    }

    @keyframes floatHeart {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 0.8rem;
      margin-bottom: 6px;
      color: var(--accent);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      font-size: 1.05rem;
      font-family: inherit;
      font-weight: 600;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: rgba(10, 6, 16, 0.75);
      color: var(--text);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow), 0 0 20px var(--primary-glow);
      background: rgba(7, 7, 15, 0.9);
    }

    .form-group input::placeholder {
      color: #475569;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.15) 50%, transparent 60%);
      transform: translateX(-100%);
      transition: transform 0.5s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn:active::after {
      transform: translateX(100%);
    }

    .btn-primary {
      background: linear-gradient(135deg, #db2777, #f472b6);
      color: white;
      box-shadow: 0 0 20px var(--primary-glow), 0 4px 15px rgba(0,0,0,0.3);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .btn-success {
      background: linear-gradient(135deg, #059669, #34d399);
      color: #052e16;
      box-shadow: 0 0 20px rgba(52, 211, 153, 0.35);
    }

    .btn-danger {
      background: linear-gradient(135deg, #e11d48, #f43f5e);
      color: white;
      box-shadow: 0 0 18px rgba(244, 63, 94, 0.3);
    }

    .btn-accent {
      background: linear-gradient(135deg, #d97706, #fbbf24);
      color: #1c1917;
      box-shadow: 0 0 20px var(--accent-glow);
      animation: pulseGlow 2s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px var(--accent-glow); }
      50% { box-shadow: 0 0 28px var(--accent-glow), 0 0 40px rgba(251, 191, 36, 0.2); }
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.5px;
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      margin-top: 12px;
      min-height: 22px;
      text-shadow: 0 0 10px rgba(244, 63, 94, 0.4);
    }

    /* ========== APP SHELL ========== */
    #app {
      display: none;
      flex-direction: column;
      min-height: 100dvh;
      padding-bottom: calc(72px + var(--safe-bottom));
    }

    .header {
      background: linear-gradient(180deg, rgba(22,16,31,0.98), rgba(14,10,20,0.95));
      color: white;
      padding: 14px 16px 18px;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 4px 30px rgba(0,0,0,0.4), 0 0 40px rgba(244, 114, 182, 0.1);
      backdrop-filter: blur(16px);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      border: 2px solid rgba(255,255,255,0.2);
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .header-user strong {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    .logout-btn {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: var(--danger);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .logout-btn:active {
      background: rgba(244, 63, 94, 0.3);
      transform: scale(0.92);
    }

    .scoreboard {
      display: flex;
      background: rgba(10, 6, 16, 0.65);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 6px;
    }

    .score-item {
      flex: 1;
      text-align: center;
      position: relative;
    }

    .score-item:first-child::after {
      content: '';
      position: absolute;
      right: 0;
      top: 10%;
      height: 80%;
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--primary), transparent);
    }

    .score-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .score-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.7rem;
      font-weight: 800;
      line-height: 1.1;
      background: linear-gradient(180deg, #fff, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .score-diff {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--accent);
      margin-top: 2px;
    }

    /* ========== CONTENT ========== */
    .content {
      flex: 1;
      padding: 18px 14px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      border: 1px solid var(--card-border);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(244,114,182,0.4), transparent);
    }

    .card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 1px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-family: 'Space Grotesk', sans-serif;
    }

    .badge-success { background: rgba(52, 211, 153, 0.15); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
    .badge-warning { background: rgba(251, 191, 36, 0.12); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
    .badge-danger { background: rgba(244, 63, 94, 0.12); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.3); }
    .badge-info { background: rgba(251, 191, 36, 0.12); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
    .badge-pink { background: rgba(192, 132, 252, 0.12); color: #f472b6; border: 1px solid rgba(244, 114, 182, 0.3); }

    /* Active desire */
    .active-card {
      background: linear-gradient(160deg, rgba(244, 114, 182, 0.12), rgba(192, 132, 252, 0.1));
      border: 1px solid rgba(244, 114, 182, 0.4);
      box-shadow: 0 0 30px rgba(244, 114, 182, 0.14), inset 0 0 40px rgba(244, 114, 182, 0.06);
      animation: activePulse 3s ease-in-out infinite;
    }

    @keyframes activePulse {
      0%, 100% { box-shadow: 0 0 25px rgba(244, 114, 182, 0.12), inset 0 0 30px rgba(244, 114, 182, 0.05); }
      50% { box-shadow: 0 0 40px rgba(244, 114, 182, 0.22), inset 0 0 50px rgba(244, 114, 182, 0.1); }
    }

    .active-card::before {
      content: '⚡';
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: 1.3rem;
      opacity: 0.6;
      animation: spark 1.5s ease-in-out infinite;
    }

    @keyframes spark {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .desire-text {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.5;
      margin: 12px 0 16px;
      color: var(--text);
      text-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    .countdown {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(10, 6, 16, 0.75);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .countdown.urgent {
      color: var(--danger);
      border-color: rgba(244, 63, 94, 0.4);
      background: rgba(244, 63, 94, 0.1);
      animation: urgentBlink 1s ease-in-out infinite;
    }

    @keyframes urgentBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .countdown-icon {
      font-size: 1.15rem;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 28px 14px;
      color: var(--text-muted);
    }

    .empty-state .icon {
      font-size: 2.6rem;
      margin-bottom: 12px;
      filter: drop-shadow(0 0 12px var(--primary-glow));
      animation: floatIcon 3s ease-in-out infinite;
    }

    @keyframes floatIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .empty-state p {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    /* Progress */
    .progress-bar {
      height: 8px;
      background: rgba(10, 6, 16, 0.85);
      border-radius: 8px;
      overflow: hidden;
      margin: 8px 0 4px;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
      background-size: 200% 100%;
      border-radius: 8px;
      transition: width 0.5s ease;
      animation: progressShine 2.5s linear infinite;
      box-shadow: 0 0 12px var(--primary-glow);
    }

    @keyframes progressShine {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Desire list item */
    .desire-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .desire-item:last-child {
      border-bottom: none;
    }

    .desire-item .num {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(244, 114, 182, 0.14);
      color: var(--primary);
      border: 1px solid rgba(244, 114, 182, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .desire-item .text {
      flex: 1;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .btn-icon {
      background: rgba(244, 114, 182, 0.12);
      border: 1px solid rgba(244, 114, 182, 0.22);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
    }

    .btn-icon:active {
      transform: scale(0.9);
      box-shadow: 0 0 12px var(--primary-glow);
    }

    .btn-icon.danger {
      background: rgba(244, 63, 94, 0.12);
      border-color: rgba(244, 63, 94, 0.3);
    }

    /* Pending confirm */
    .pending-item {
      background: rgba(251, 191, 36, 0.08);
      border: 1px solid rgba(251, 191, 36, 0.3);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      animation: pendingGlow 2.5s ease-in-out infinite;
    }

    @keyframes pendingGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(251, 191, 36, 0.1); }
      50% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.2); }
    }

    .pending-item .who {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--warning);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
      font-family: 'Space Grotesk', sans-serif;
    }

    .pending-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .pending-actions .btn {
      flex: 1;
      padding: 12px;
      font-size: 0.85rem;
    }

    /* Bottom nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(12, 12, 22, 0.95);
      border-top: 1px solid var(--card-border);
      display: flex;
      padding: 6px 0 calc(8px + var(--safe-bottom));
      z-index: 100;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.4);
      backdrop-filter: blur(16px);
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px 4px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: color 0.2s, text-shadow 0.2s;
      text-transform: uppercase;
    }

    .nav-item.active {
      color: var(--accent);
      text-shadow: 0 0 12px var(--accent-glow);
    }

    .nav-item .icon {
      font-size: 1.35rem;
      transition: transform 0.2s;
    }

    .nav-item.active .icon {
      transform: scale(1.1);
      filter: drop-shadow(0 0 6px var(--accent-glow));
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 6, 16, 0.8);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s, visibility 0.25s;
      backdrop-filter: blur(6px);
    }

    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: linear-gradient(180deg, #1a1224, #120c18);
      border: 1px solid var(--card-border);
      border-bottom: none;
      border-radius: 24px 24px 0 0;
      padding: 20px 18px calc(24px + var(--safe-bottom));
      width: 100%;
      max-width: 480px;
      max-height: 85dvh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      box-shadow: 0 -10px 50px rgba(244, 114, 182, 0.14);
    }

    .modal-overlay.show .modal {
      transform: translateY(0);
    }

    .modal-handle {
      width: 40px;
      height: 4px;
      background: rgba(168, 85, 247, 0.4);
      border-radius: 4px;
      margin: 0 auto 16px;
    }

    .modal h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.15rem;
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-align: center;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .modal p.sub {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 14px;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      resize: vertical;
      margin-bottom: 16px;
      background: rgba(10, 6, 16, 0.75);
      color: var(--text);
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .char-count {
      text-align: right;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: -10px;
      margin-bottom: 12px;
      font-family: 'Space Grotesk', sans-serif;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-120px);
      background: linear-gradient(135deg, #2a1528, #16101f);
      color: white;
      padding: 14px 22px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      font-weight: 700;
      font-size: 0.9rem;
      z-index: 300;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4), 0 0 20px var(--primary-glow);
      transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
      max-width: 90%;
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 0.5px;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast.success {
      background: linear-gradient(135deg, #064e3b, #022c22);
      border-color: rgba(52, 211, 153, 0.4);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4), 0 0 25px rgba(52, 211, 153, 0.3);
    }

    .toast.error {
      background: linear-gradient(135deg, #881337, #4c0519);
      border-color: rgba(244, 63, 94, 0.4);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4), 0 0 25px rgba(244, 63, 94, 0.3);
    }

    /* Loading */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 6, 16, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 400;
      opacity: 0;
      visibility: hidden;
      transition: 0.2s;
      backdrop-filter: blur(4px);
    }

    .loading-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(244, 114, 182, 0.18);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      box-shadow: 0 0 20px var(--primary-glow);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* History */
    .history-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      align-items: flex-start;
    }

    .history-item:last-child { border-bottom: none; }

    .history-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .history-icon.ok {
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.3);
    }
    .history-icon.fail {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    .history-content {
      flex: 1;
    }

    .history-content .text {
      font-size: 0.9rem;
      line-height: 1.35;
      margin-bottom: 4px;
    }

    .history-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: 'Space Grotesk', sans-serif;
    }

    /* Section headers */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-header h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Utils */
    .hidden { display: none !important; }
    .mt-12 { margin-top: 12px; }
    .mt-16 { margin-top: 16px; }
    .mb-8 { margin-bottom: 8px; }
    .text-center { text-align: center; }
    .flex-gap { display: flex; gap: 10px; }
    .flex-gap .btn { flex: 1; }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-in {
      animation: fadeInUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Winner banner */
    .winner-banner {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(245, 158, 11, 0.1));
      border: 1px solid rgba(251, 191, 36, 0.4);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      margin-bottom: 14px;
      box-shadow: 0 0 25px rgba(251, 191, 36, 0.15);
      animation: winnerPulse 2s ease-in-out infinite;
    }

    @keyframes winnerPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.1); }
      50% { box-shadow: 0 0 35px rgba(251, 191, 36, 0.25); }
    }

    .winner-banner .title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      color: var(--warning);
      font-size: 1rem;
      letter-spacing: 1px;
    }

    /* Screen shake for important actions */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px); }
      40% { transform: translateX(4px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }

    .shake {
      animation: shake 0.4s ease;
    }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-card animate-in">
      <div class="logo">
        <div class="hearts">⚡ 💜 ⚡</div>
        <h1>DESEJOS</h1>
        <p>Tayna // Guilherme</p>
      </div>
      <div class="form-group">
        <label for="username">Login</label>
        <input type="text" id="username" placeholder="Seu nome" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="Sua senha" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary" id="btn-login" onclick="doLogin()">
        Entrar no jogo
      </button>
      <div class="error-msg" id="login-error"></div>
    </div>
  </div>

  <!-- APP -->
  <div id="app">
    <header class="header">
      <div class="header-top">
        <div class="header-user">
          <div class="avatar" id="user-avatar">T</div>
          <div>
            <strong id="user-name">Tayna</strong>
            <div style="font-size:0.75rem;opacity:0.85" id="user-role">Jogador</div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()" title="Sair">⎋</button>
      </div>
      <div class="scoreboard">
        <div class="score-item">
          <div class="score-label" id="score-label-me">Você</div>
          <div class="score-value" id="score-me">0</div>
          <div class="score-diff" id="score-diff-me"></div>
        </div>
        <div class="score-item">
          <div class="score-label" id="score-label-other">Parceiro(a)</div>
          <div class="score-value" id="score-other">0</div>
          <div class="score-diff" id="score-diff-other"></div>
        </div>
      </div>
    </header>

    <main class="content" id="main-content">
      <!-- Views will be injected here -->
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-view="home" onclick="switchView('home')">
        <span class="icon">🏠</span>
        Início
      </button>
      <button class="nav-item" data-view="write" onclick="switchView('write')">
        <span class="icon">✍️</span>
        Escrever
      </button>
      <button class="nav-item" data-view="pending" onclick="switchView('pending')">
        <span class="icon">🔔</span>
        Confirmar
      </button>
      <button class="nav-item" data-view="history" onclick="switchView('history')">
        <span class="icon">📜</span>
        Histórico
      </button>
    </nav>
  </div>

  <!-- Modal Add Desire -->
  <div class="modal-overlay" id="modal-add">
    <div class="modal">
      <div class="modal-handle"></div>
      <h3>Novo Desejo</h3>
      <p class="sub">Escreva um desejo que o outro deverá cumprir</p>
      <textarea id="new-desire-text" placeholder="Ex: Me leve para jantar em um lugar especial..." maxlength="300"></textarea>
      <div class="char-count"><span id="char-count">0</span>/300</div>
      <div class="flex-gap">
        <button class="btn btn-ghost" onclick="closeModal('modal-add')">Cancelar</button>
        <button class="btn btn-primary" id="btn-save-desire" onclick="saveDesire()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Modal Edit Desire -->
  <div class="modal-overlay" id="modal-edit">
    <div class="modal">
      <div class="modal-handle"></div>
      <h3>Editar Desejo</h3>
      <p class="sub">Só é possível editar desejos ainda não revelados</p>
      <textarea id="edit-desire-text" placeholder="Texto do desejo..." maxlength="300"></textarea>
      <div class="char-count"><span id="edit-char-count">0</span>/300</div>
      <input type="hidden" id="edit-desire-id" />
      <div class="flex-gap">
        <button class="btn btn-ghost" onclick="closeModal('modal-edit')">Cancelar</button>
        <button class="btn btn-primary" onclick="updateDesire()">Salvar alterações</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Loading -->
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
  </div>

  <script>
    // ========== CONFIG ==========
    const API_URL = 'https://699107e56279728b0153afac.mockapi.io/Game';
    const GAME_ID = '1';
    const DEADLINE_DAYS = 6;
    const POINTS_SUCCESS = 10;
    const POINTS_FAIL = -5;
    const MAX_DESIRES = 30;

    const CREDENTIALS = {
      tayna: { password: '12124800', name: 'Tayna', initial: 'T' },
      guilherme: { password: '105046', name: 'Guilherme', initial: 'G' }
    };

    // ========== STATE ==========
    let currentUser = null; // 'tayna' | 'guilherme'
    let game = null;
    let currentView = 'home';
    let countdownInterval = null;
    let audioCtx = null;

    // ========== AUDIO & HAPTICS ==========
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, duration, type = 'square', volume = 0.08, slideTo = null) {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
        }
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playSound(name) {
      switch (name) {
        case 'click':
          playTone(800, 0.06, 'square', 0.06);
          vibrate(8);
          break;
        case 'success':
          playTone(523, 0.1, 'sine', 0.1);
          setTimeout(() => playTone(659, 0.1, 'sine', 0.1), 80);
          setTimeout(() => playTone(784, 0.18, 'sine', 0.12), 160);
          vibrate([30, 40, 50]);
          break;
        case 'error':
          playTone(200, 0.15, 'sawtooth', 0.08);
          setTimeout(() => playTone(150, 0.2, 'sawtooth', 0.06), 100);
          vibrate([60, 30, 60]);
          break;
        case 'reveal':
          playTone(300, 0.08, 'square', 0.07, 600);
          setTimeout(() => playTone(600, 0.12, 'square', 0.08, 900), 100);
          setTimeout(() => playTone(900, 0.15, 'sine', 0.1), 220);
          vibrate([20, 30, 40, 30, 60]);
          break;
        case 'confirm':
          playTone(440, 0.08, 'triangle', 0.09);
          setTimeout(() => playTone(554, 0.08, 'triangle', 0.09), 70);
          setTimeout(() => playTone(659, 0.2, 'triangle', 0.1), 140);
          vibrate([25, 20, 40]);
          break;
        case 'delete':
          playTone(400, 0.08, 'sawtooth', 0.06, 150);
          vibrate(40);
          break;
        case 'nav':
          playTone(600, 0.04, 'sine', 0.04);
          vibrate(5);
          break;
        case 'login':
          playTone(350, 0.1, 'sine', 0.1, 700);
          setTimeout(() => playTone(700, 0.15, 'sine', 0.1), 120);
          vibrate([20, 30, 40]);
          break;
        case 'reset':
          playTone(150, 0.3, 'sawtooth', 0.1);
          setTimeout(() => playTone(100, 0.4, 'sawtooth', 0.08), 200);
          vibrate([80, 50, 80, 50, 120]);
          break;
        default:
          playTone(500, 0.05, 'square', 0.05);
      }
    }

    function vibrate(pattern) {
      if (navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch (e) {}
      }
    }

    // ========== UTILS ==========
    function $(id) { return document.getElementById(id); }

    function showLoading(show = true) {
      $('loading').classList.toggle('show', show);
    }

    function toast(msg, type = '') {
      const el = $('toast');
      el.textContent = msg;
      el.className = 'toast show ' + type;
      if (type === 'success') playSound('success');
      else if (type === 'error') playSound('error');
      setTimeout(() => el.classList.remove('show'), 2800);
    }

    function uuid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function formatDate(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    function daysLeft(deadline) {
      if (!deadline) return null;
      const now = Date.now();
      const diff = deadline - now;
      if (diff <= 0) return 0;
      return Math.ceil(diff / (1000 * 60 * 60 * 24));
    }

    function formatCountdown(deadline) {
      if (!deadline) return '—';
      const now = Date.now();
      let diff = deadline - now;
      if (diff <= 0) return 'Prazo esgotado!';
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      diff %= (1000 * 60 * 60 * 24);
      const hours = Math.floor(diff / (1000 * 60 * 60));
      const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      if (days > 0) return `${days}d ${hours}h ${mins}m`;
      return `${hours}h ${mins}m`;
    }

    function otherUser(user) {
      return user === 'tayna' ? 'guilherme' : 'tayna';
    }

    // ========== API ==========
    async function fetchGame() {
      const res = await fetch(`${API_URL}/${GAME_ID}`);
      if (!res.ok) throw new Error('Erro ao carregar jogo');
      return res.json();
    }

    async function saveGame(data) {
      const res = await fetch(`${API_URL}/${GAME_ID}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (!res.ok) throw new Error('Erro ao salvar');
      return res.json();
    }

    async function loadAndCheck() {
      showLoading(true);
      try {
        game = await fetchGame();
        // Ensure structure
        if (!game.players) game.players = { tayna: { score: 0 }, guilherme: { score: 0 } };
        if (!game.desires) game.desires = [];
        if (!game.active) game.active = { tayna: null, guilherme: null };
        if (!game.resetRequest) game.resetRequest = null;

        // Check deadlines for both players (active or pending_confirm)
        let changed = false;
        const now = Date.now();
        for (const player of ['tayna', 'guilherme']) {
          const activeId = game.active[player];
          if (!activeId) continue;
          const desire = game.desires.find(d => d.id === activeId);
          if (!desire) {
            game.active[player] = null;
            changed = true;
            continue;
          }
          if ((desire.status === 'active' || desire.status === 'pending_confirm') && desire.deadline && now > desire.deadline) {
            // Failed by deadline
            desire.status = 'failed';
            desire.failedAt = now;
            desire.confirmRequestedBy = null;
            desire.confirmRequestedAt = null;
            game.players[player].score = (game.players[player].score || 0) + POINTS_FAIL;
            game.active[player] = null;
            changed = true;
          }
        }
        if (changed) {
          game = await saveGame(game);
        }
      } catch (e) {
        console.error(e);
        toast('Erro de conexão. Tente novamente.', 'error');
      } finally {
        showLoading(false);
      }
    }

    // ========== AUTH ==========
    function doLogin() {
      const user = $('username').value.trim().toLowerCase();
      const pass = $('password').value.trim();
      const errorEl = $('login-error');
      initAudio();

      if (!CREDENTIALS[user] || CREDENTIALS[user].password !== pass) {
        errorEl.textContent = 'Login ou senha incorretos';
        playSound('error');
        return;
      }

      currentUser = user;
      localStorage.setItem('desejos_user', user);
      errorEl.textContent = '';
      playSound('login');
      startApp();
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem('desejos_user');
      if (countdownInterval) clearInterval(countdownInterval);
      $('app').style.display = 'none';
      $('login-screen').style.display = 'flex';
      $('username').value = '';
      $('password').value = '';
    }

    async function startApp() {
      $('login-screen').style.display = 'none';
      $('app').style.display = 'flex';
      $('user-name').textContent = CREDENTIALS[currentUser].name;
      $('user-avatar').textContent = CREDENTIALS[currentUser].initial;
      await loadAndCheck();
      updateScoreboard();
      switchView('home');
      // Auto refresh every 60s
      setInterval(async () => {
        await loadAndCheck();
        updateScoreboard();
        if (currentView === 'home' || currentView === 'pending') renderView();
      }, 60000);
    }

    // ========== SCOREBOARD ==========
    function updateScoreboard() {
      if (!game || !currentUser) return;
      const me = currentUser;
      const other = otherUser(me);
      const scoreMe = game.players[me]?.score || 0;
      const scoreOther = game.players[other]?.score || 0;

      $('score-me').textContent = scoreMe;
      $('score-other').textContent = scoreOther;
      $('score-label-me').textContent = CREDENTIALS[me].name;
      $('score-label-other').textContent = CREDENTIALS[other].name;

      const diff = scoreMe - scoreOther;
      if (diff > 0) {
        $('score-diff-me').textContent = `+${diff} à frente`;
        $('score-diff-other').textContent = '';
      } else if (diff < 0) {
        $('score-diff-me').textContent = '';
        $('score-diff-other').textContent = `+${Math.abs(diff)} à frente`;
      } else {
        $('score-diff-me').textContent = 'Empate';
        $('score-diff-other').textContent = 'Empate';
      }
    }

    // ========== VIEWS ==========
    function switchView(view) {
      if (view !== currentView) playSound('nav');
      currentView = view;
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });
      renderView();
    }

    function renderView() {
      if (!game) return;
      const content = $('main-content');
      content.innerHTML = '';

      if (currentView === 'home') renderHome(content);
      else if (currentView === 'write') renderWrite(content);
      else if (currentView === 'pending') renderPending(content);
      else if (currentView === 'history') renderHistory(content);
    }

    // ----- HOME -----
    function renderHome(container) {
      const me = currentUser;
      const other = otherUser(me);
      const myActiveId = game.active[me];
      const myActive = myActiveId ? game.desires.find(d => d.id === myActiveId) : null;

      // Written by other that are available
      const availableFromOther = game.desires.filter(d =>
        d.writer === other && d.status === 'available'
      );

      // Written by me
      const myWritten = game.desires.filter(d => d.writer === me);

      let html = '';

      // Reset request banner
      if (game.resetRequest && game.resetRequest.from !== me) {
        html += `
          <div class="card animate-in" style="background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.4);margin-bottom:16px">
            <div style="font-weight:800;color:var(--warning);margin-bottom:6px;font-family:Space Grotesk,sans-serif;letter-spacing:1px">⚠️ SOLICITAÇÃO DE RESET</div>
            <p style="font-size:0.9rem;color:var(--text-muted);margin-bottom:12px">
              ${CREDENTIALS[game.resetRequest.from].name} pediu para resetar o jogo.
            </p>
            <button class="btn btn-primary" style="background:linear-gradient(135deg,#f59e0b,#d97706);color:#1c1917" onclick="switchView('write')">
              Ver e responder
            </button>
          </div>
        `;
      }
      // Winner check (if all done)
      const allMyDesiresDone = availableFromOther.length === 0 && !myActive;
      const totalFromOther = game.desires.filter(d => d.writer === other).length;
      if (totalFromOther >= MAX_DESIRES && allMyDesiresDone) {
        const scoreMe = game.players[me]?.score || 0;
        const scoreOther = game.players[other]?.score || 0;
        if (scoreMe > scoreOther) {
          html += `<div class="winner-banner animate-in"><div class="title">🏆 Você está vencendo!</div><div style="font-size:0.9rem;color:var(--text-muted);margin-top:4px">Mais pontos no final</div></div>`;
        } else if (scoreOther > scoreMe) {
          html += `<div class="winner-banner animate-in"><div class="title">💪 Continue firme!</div><div style="font-size:0.9rem;color:var(--text-muted);margin-top:4px">${CREDENTIALS[other].name} está na frente</div></div>`;
        }
      }

      // Active desire
      if (myActive) {
        const left = daysLeft(myActive.deadline);
        const isUrgent = left !== null && left <= 1;
        html += `
          <div class="card active-card animate-in">
            <div class="card-title">
              🎯 Seu desejo ativo
              <span class="badge ${isUrgent ? 'badge-danger' : 'badge-info'}">Em andamento</span>
            </div>
            <div class="desire-text">"${escapeHtml(myActive.text)}"</div>
            <div class="countdown ${isUrgent ? 'urgent' : ''}" id="countdown-box">
              <span class="countdown-icon">⏳</span>
              <span id="countdown-text">${formatCountdown(myActive.deadline)}</span>
            </div>
            <button class="btn btn-success" onclick="requestConfirm('${myActive.id}')">
              ✅ Marquei como cumprido
            </button>
          </div>
        `;
      } else {
        // Can reveal?
        if (availableFromOther.length > 0) {
          html += `
            <div class="card animate-in">
              <div class="empty-state">
                <div class="icon">🎲</div>
                <p>Você não tem desejo ativo.<br>Existem <strong>${availableFromOther.length}</strong> desejo(s) disponíveis da lista de ${CREDENTIALS[other].name}.</p>
                <button class="btn btn-accent" onclick="revealDesire()">
                  Revelar desejo aleatório
                </button>
              </div>
            </div>
          `;
        } else if (myWritten.length === 0 && availableFromOther.length === 0) {
          html += `
            <div class="card animate-in">
              <div class="empty-state">
                <div class="icon">💌</div>
                <p>Ainda não há desejos da outra pessoa.<br>Peça para ${CREDENTIALS[other].name} escrever alguns!</p>
              </div>
            </div>
          `;
        } else {
          html += `
            <div class="card animate-in">
              <div class="empty-state">
                <div class="icon">🎉</div>
                <p>Você já revelou todos os desejos disponíveis de ${CREDENTIALS[other].name}!</p>
              </div>
            </div>
          `;
        }
      }

      // Stats
      const writtenCount = myWritten.length;
      const availableCount = availableFromOther.length;
      const completedCount = game.desires.filter(d => d.writer === other && d.status === 'completed').length;
      const failedCount = game.desires.filter(d => d.writer === other && d.status === 'failed').length;

      html += `
        <div class="card animate-in" style="animation-delay:0.05s">
          <div class="card-title">📊 Seu progresso</div>
          <div class="progress-label">
            <span>Desejos escritos por você</span>
            <span>${writtenCount}/${MAX_DESIRES}</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width:${(writtenCount / MAX_DESIRES) * 100}%"></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px">
            <div style="background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.25);border-radius:12px;padding:12px;text-align:center">
              <div style="font-family:Space Grotesk,sans-serif;font-size:1.4rem;font-weight:800;color:#34d399">${completedCount}</div>
              <div style="font-size:0.75rem;color:var(--text-muted)">Cumpridos</div>
            </div>
            <div style="background:rgba(244,63,94,0.1);border:1px solid rgba(244,63,94,0.25);border-radius:12px;padding:12px;text-align:center">
              <div style="font-family:Space Grotesk,sans-serif;font-size:1.4rem;font-weight:800;color:#f43f5e">${failedCount}</div>
              <div style="font-size:0.75rem;color:var(--text-muted)">Não cumpridos</div>
            </div>
          </div>
          <div style="margin-top:12px;font-size:0.85rem;color:var(--text-muted);text-align:center">
            Disponíveis para revelar: <strong>${availableCount}</strong>
          </div>
        </div>
      `;

      // Quick tip
      html += `
        <div class="card animate-in" style="animation-delay:0.1s;background:rgba(244,114,182,0.07)">
          <div style="font-size:0.9rem;line-height:1.55;color:var(--text-muted)">
            <strong style="color:var(--accent);font-family:Space Grotesk,sans-serif;letter-spacing:1px">COMO JOGAR</strong><br>
            1. Escreva desejos para o outro cumprir<br>
            2. Revele um desejo aleatório da lista do outro<br>
            3. Você tem <strong style="color:var(--warning)">6 dias</strong> para cumprir<br>
            4. Marque como cumprido → o outro confirma<br>
            5. <span style="color:var(--success)">+10 pts</span> se cumprir | <span style="color:var(--danger)">−5 pts</span> se perder o prazo
          </div>
        </div>
      `;

      container.innerHTML = html;

      // Start countdown if active
      if (myActive && countdownInterval) clearInterval(countdownInterval);
      if (myActive) {
        countdownInterval = setInterval(() => {
          const el = $('countdown-text');
          if (el) el.textContent = formatCountdown(myActive.deadline);
          // If expired, reload
          if (Date.now() > myActive.deadline) {
            clearInterval(countdownInterval);
            loadAndCheck().then(() => {
              updateScoreboard();
              renderView();
            });
          }
        }, 30000);
      }
    }

    // ----- WRITE -----
    function renderWrite(container) {
      const myWritten = game.desires.filter(d => d.writer === currentUser);
      const count = myWritten.length;

      let html = `
        <div class="section-header">
          <h2>✍️ Seus desejos</h2>
          <span class="badge badge-pink">${count}/${MAX_DESIRES}</span>
        </div>
        <div class="progress-bar" style="margin-bottom:16px">
          <div class="progress-fill" style="width:${(count / MAX_DESIRES) * 100}%"></div>
        </div>
      `;

      if (count < MAX_DESIRES) {
        html += `
          <button class="btn btn-primary" style="margin-bottom:16px" onclick="openAddModal()">
            + Adicionar desejo
          </button>
        `;
      } else {
        html += `<div class="card"><div class="empty-state"><p>Você já escreveu os 30 desejos! 🎉</p></div></div>`;
      }

      if (myWritten.length === 0) {
        html += `
          <div class="card">
            <div class="empty-state">
              <div class="icon">📝</div>
              <p>Você ainda não escreveu nenhum desejo.<br>Crie desejos que ${CREDENTIALS[otherUser(currentUser)].name} deverá cumprir.</p>
            </div>
          </div>
        `;
      } else {
        html += `<div class="card">`;
        myWritten.slice().reverse().forEach((d, i) => {
          let statusBadge = '';
          if (d.status === 'available') statusBadge = '<span class="badge badge-info">Disponível</span>';
          else if (d.status === 'active') statusBadge = '<span class="badge badge-warning">Ativo</span>';
          else if (d.status === 'pending_confirm') statusBadge = '<span class="badge badge-pink">Aguardando confirmação</span>';
          else if (d.status === 'completed') statusBadge = '<span class="badge badge-success">Cumprido</span>';
          else if (d.status === 'failed') statusBadge = '<span class="badge badge-danger">Não cumprido</span>';

          const canEdit = d.status === 'available';
          html += `
            <div class="desire-item">
              <div class="num">${myWritten.length - i}</div>
              <div class="text">
                ${escapeHtml(d.text)}
                <div style="margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                  ${statusBadge}
                  ${canEdit ? `
                    <button class="btn-icon" onclick="openEditModal('${d.id}')" title="Editar">✏️</button>
                    <button class="btn-icon danger" onclick="deleteDesire('${d.id}')" title="Excluir">🗑️</button>
                  ` : ''}
                </div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }

      // Reset section
      html += renderResetSection();

      container.innerHTML = html;
    }

    function renderResetSection() {
      const req = game.resetRequest;
      let html = `
        <div class="card" style="margin-top:20px;border:1px dashed rgba(244,63,94,0.4);background:rgba(244,63,94,0.06)">
          <div class="card-title" style="color:var(--danger)">🔄 RESETAR JOGO</div>
          <p style="font-size:0.9rem;color:var(--text-muted);margin-bottom:14px;line-height:1.45">
            Apaga <strong>todos</strong> os desejos, pontuações e progresso. Só acontece se <strong>os dois</strong> concordarem.
          </p>
      `;

      if (!req) {
        html += `
          <button class="btn btn-danger" onclick="requestReset()">
            Solicitar reset do jogo
          </button>
        `;
      } else if (req.from === currentUser) {
        html += `
          <div style="background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.25);border-radius:12px;padding:14px;margin-bottom:12px">
            <div style="font-weight:700;color:var(--warning);margin-bottom:4px;font-family:Space Grotesk,sans-serif">Aguardando o outro...</div>
            <div style="font-size:0.85rem;color:var(--text-muted)">
              Você solicitou o reset. ${CREDENTIALS[otherUser(currentUser)].name} precisa confirmar.
            </div>
          </div>
          <button class="btn btn-ghost" onclick="cancelReset()">Cancelar minha solicitação</button>
        `;
      } else {
        html += `
          <div style="background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.3);border-radius:12px;padding:14px;margin-bottom:12px">
            <div style="font-weight:700;color:var(--warning);margin-bottom:4px;font-family:Space Grotesk,sans-serif">
              ${CREDENTIALS[req.from].name} pediu para resetar o jogo
            </div>
            <div style="font-size:0.85rem;color:var(--text-muted)">
              Solicitado em ${formatDate(req.at)}
            </div>
          </div>
          <div class="flex-gap">
            <button class="btn btn-ghost" onclick="rejectReset()">Recusar</button>
            <button class="btn btn-danger" onclick="confirmReset()">Confirmar reset</button>
          </div>
        `;
      }

      html += `</div>`;
      return html;
    }

    // ----- PENDING -----
    function renderPending(container) {
      // Pending confirmations: desires that I wrote, status pending_confirm
      const pending = game.desires.filter(d =>
        d.writer === currentUser && d.status === 'pending_confirm'
      );

      let html = `
        <div class="section-header">
          <h2>🔔 Confirmações</h2>
          <span class="badge badge-warning">${pending.length}</span>
        </div>
      `;

      if (pending.length === 0) {
        html += `
          <div class="card">
            <div class="empty-state">
              <div class="icon">✅</div>
              <p>Nenhuma confirmação pendente no momento.</p>
            </div>
          </div>
        `;
      } else {
        pending.forEach(d => {
          const requester = d.confirmRequestedBy;
          html += `
            <div class="pending-item animate-in">
              <div class="who">${CREDENTIALS[requester]?.name || requester} diz que cumpriu:</div>
              <div class="desire-text" style="font-size:1.05rem;margin:8px 0">"${escapeHtml(d.text)}"</div>
              <div style="font-size:0.8rem;color:var(--text-muted)">Solicitado em ${formatDate(d.confirmRequestedAt)}</div>
              <div class="pending-actions">
                <button class="btn btn-danger" onclick="rejectConfirm('${d.id}')">Recusar</button>
                <button class="btn btn-success" onclick="approveConfirm('${d.id}')">Confirmar</button>
              </div>
            </div>
          `;
        });
      }

      // Also show if I have a pending that I requested (waiting)
      const myPending = game.desires.filter(d =>
        d.confirmRequestedBy === currentUser && d.status === 'pending_confirm'
      );
      if (myPending.length > 0) {
        html += `
          <div class="card mt-16">
            <div class="card-title">⏳ Aguardando confirmação</div>
            ${myPending.map(d => `
              <div style="padding:10px 0;border-bottom:1px solid var(--border)">
                <div style="font-weight:600">"${escapeHtml(d.text)}"</div>
                <div style="font-size:0.8rem;color:var(--text-muted);margin-top:4px">
                  Aguardando ${CREDENTIALS[d.writer]?.name}
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      container.innerHTML = html;
    }

    // ----- HISTORY -----
    function renderHistory(container) {
      const other = otherUser(currentUser);
      // Desires I had to fulfill (written by other)
      const myHistory = game.desires
        .filter(d => d.writer === other && (d.status === 'completed' || d.status === 'failed'))
        .sort((a, b) => (b.completedAt || b.failedAt || 0) - (a.completedAt || a.failedAt || 0));

      let html = `
        <div class="section-header">
          <h2>📜 Histórico</h2>
        </div>
      `;

      if (myHistory.length === 0) {
        html += `
          <div class="card">
            <div class="empty-state">
              <div class="icon">📭</div>
              <p>Nenhum desejo cumprido ou perdido ainda.</p>
            </div>
          </div>
        `;
      } else {
        html += `<div class="card">`;
        myHistory.forEach(d => {
          const ok = d.status === 'completed';
          html += `
            <div class="history-item">
              <div class="history-icon ${ok ? 'ok' : 'fail'}">${ok ? '✅' : '❌'}</div>
              <div class="history-content">
                <div class="text">${escapeHtml(d.text)}</div>
                <div class="history-meta">
                  ${ok ? `+${POINTS_SUCCESS} pts · ${formatDate(d.completedAt)}` : `${POINTS_FAIL} pts · ${formatDate(d.failedAt)}`}
                </div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }

      container.innerHTML = html;
    }

    // ========== ACTIONS ==========
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function openModal(id) {
      $(id).classList.add('show');
    }

    function closeModal(id) {
      $(id).classList.remove('show');
    }

    function openAddModal() {
      $('new-desire-text').value = '';
      $('char-count').textContent = '0';
      openModal('modal-add');
      setTimeout(() => $('new-desire-text').focus(), 300);
    }

    function openEditModal(desireId) {
      const desire = game.desires.find(d => d.id === desireId);
      if (!desire || desire.status !== 'available') {
        toast('Só é possível editar desejos disponíveis', 'error');
        return;
      }
      $('edit-desire-id').value = desireId;
      $('edit-desire-text').value = desire.text;
      $('edit-char-count').textContent = desire.text.length;
      openModal('modal-edit');
      setTimeout(() => $('edit-desire-text').focus(), 300);
    }

    // Char count
    document.addEventListener('input', (e) => {
      if (e.target.id === 'new-desire-text') {
        $('char-count').textContent = e.target.value.length;
      }
      if (e.target.id === 'edit-desire-text') {
        $('edit-char-count').textContent = e.target.value.length;
      }
    });

    async function saveDesire() {
      const text = $('new-desire-text').value.trim();
      if (!text) {
        toast('Escreva o desejo', 'error');
        return;
      }
      if (text.length < 5) {
        toast('Desejo muito curto', 'error');
        return;
      }

      const myWritten = game.desires.filter(d => d.writer === currentUser);
      if (myWritten.length >= MAX_DESIRES) {
        toast('Limite de 30 desejos atingido', 'error');
        return;
      }

      showLoading(true);
      try {
        game.desires.push({
          id: uuid(),
          writer: currentUser,
          text: text,
          status: 'available',
          revealedAt: null,
          deadline: null,
          confirmRequestedBy: null,
          confirmRequestedAt: null,
          completedAt: null,
          failedAt: null
        });
        game = await saveGame(game);
        closeModal('modal-add');
        playSound('confirm');
        toast('Desejo salvo! 💜', 'success');
        renderView();
      } catch (e) {
        toast('Erro ao salvar', 'error');
      } finally {
        showLoading(false);
      }
    }

    async function updateDesire() {
      const id = $('edit-desire-id').value;
      const text = $('edit-desire-text').value.trim();
      if (!text || text.length < 5) {
        toast('Desejo muito curto', 'error');
        return;
      }

      const desire = game.desires.find(d => d.id === id);
      if (!desire || desire.status !== 'available' || desire.writer !== currentUser) {
        toast('Não é possível editar este desejo', 'error');
        return;
      }

      showLoading(true);
      try {
        desire.text = text;
        game = await saveGame(game);
        closeModal('modal-edit');
        playSound('confirm');
        toast('Desejo atualizado! ✏️', 'success');
        renderView();
      } catch (e) {
        toast('Erro ao atualizar', 'error');
      } finally {
        showLoading(false);
      }
    }

    async function deleteDesire(desireId) {
      const desire = game.desires.find(d => d.id === desireId);
      if (!desire || desire.status !== 'available' || desire.writer !== currentUser) {
        toast('Só é possível excluir desejos disponíveis', 'error');
        return;
      }

      if (!confirm('Tem certeza que deseja excluir este desejo?')) return;

      showLoading(true);
      try {
        game.desires = game.desires.filter(d => d.id !== desireId);
        game = await saveGame(game);
        playSound('delete');
        toast('Desejo excluído', 'success');
        renderView();
      } catch (e) {
        toast('Erro ao excluir', 'error');
      } finally {
        showLoading(false);
      }
    }

    // ========== RESET CONSENSUAL ==========
    async function requestReset() {
      if (!confirm('Solicitar o reset do jogo? O outro jogador precisará confirmar.')) return;

      showLoading(true);
      try {
        game.resetRequest = {
          from: currentUser,
          at: Date.now()
        };
        game = await saveGame(game);
        toast('Solicitação enviada. Aguardando o outro jogador.', 'success');
        renderView();
      } catch (e) {
        toast('Erro ao solicitar reset', 'error');
      } finally {
        showLoading(false);
      }
    }

    async function cancelReset() {
      showLoading(true);
      try {
        game.resetRequest = null;
        game = await saveGame(game);
        toast('Solicitação cancelada');
        renderView();
      } catch (e) {
        toast('Erro', 'error');
      } finally {
        showLoading(false);
      }
    }

    async function rejectReset() {
      showLoading(true);
      try {
        game.resetRequest = null;
        game = await saveGame(game);
        toast('Reset recusado');
        renderView();
      } catch (e) {
        toast('Erro', 'error');
      } finally {
        showLoading(false);
      }
    }

    async function confirmReset() {
      if (!confirm('CONFIRMAR RESET?\n\nIsso apagará TODOS os desejos, pontuações e progresso permanentemente.')) return;

      showLoading(true);
      try {
        game.players = {
          tayna: { score: 0 },
          guilherme: { score: 0 }
        };
        game.desires = [];
        game.active = { tayna: null, guilherme: null };
        game.resetRequest = null;
        game = await saveGame(game);
        playSound('reset');
        toast('Jogo resetado com sucesso! 🔄', 'success');
        updateScoreboard();
        renderView();
        switchView('home');
        document.body.classList.add('shake');
        setTimeout(() => document.body.classList.remove('shake'), 500);
      } catch (e) {
        toast('Erro ao resetar', 'error');
      } finally {
        showLoading(false);
      }
    }

    async function revealDesire() {
      const other = otherUser(currentUser);
      const available = game.desires.filter(d => d.writer === other && d.status === 'available');
      if (available.length === 0) {
        toast('Nenhum desejo disponível', 'error');
        return;
      }
      if (game.active[currentUser]) {
        toast('Você já tem um desejo ativo', 'error');
        return;
      }

      // Random
      const chosen = available[Math.floor(Math.random() * available.length)];
      const now = Date.now();
      const deadline = now + (DEADLINE_DAYS * 24 * 60 * 60 * 1000);

      showLoading(true);
      try {
        chosen.status = 'active';
        chosen.revealedAt = now;
        chosen.deadline = deadline;
        game.active[currentUser] = chosen.id;
        game = await saveGame(game);
        playSound('reveal');
        toast('Desejo revelado! Você tem 6 dias ⏳', 'success');
        updateScoreboard();
        renderView();
        // Screen feedback
        document.body.classList.add('shake');
        setTimeout(() => document.body.classList.remove('shake'), 400);
      } catch (e) {
        toast('Erro ao revelar', 'error');
      } finally {
        showLoading(false);
      }
    }

    async function requestConfirm(desireId) {
      const desire = game.desires.find(d => d.id === desireId);
      if (!desire || desire.status !== 'active') {
        toast('Desejo inválido', 'error');
        return;
      }

      showLoading(true);
      try {
        desire.status = 'pending_confirm';
        desire.confirmRequestedBy = currentUser;
        desire.confirmRequestedAt = Date.now();
        // Keep active until confirmed or rejected
        game = await saveGame(game);
        playSound('confirm');
        toast('Aguardando confirmação do outro 💌', 'success');
        renderView();
        switchView('pending');
      } catch (e) {
        toast('Erro', 'error');
      } finally {
        showLoading(false);
      }
    }

    async function approveConfirm(desireId) {
      const desire = game.desires.find(d => d.id === desireId);
      if (!desire || desire.status !== 'pending_confirm') return;

      const fulfiller = desire.confirmRequestedBy;

      showLoading(true);
      try {
        desire.status = 'completed';
        desire.completedAt = Date.now();
        game.players[fulfiller].score = (game.players[fulfiller].score || 0) + POINTS_SUCCESS;
        game.active[fulfiller] = null;
        game = await saveGame(game);
        playSound('success');
        toast(`Confirmado! +${POINTS_SUCCESS} pontos para ${CREDENTIALS[fulfiller].name} 🎉`, 'success');
        updateScoreboard();
        renderView();
        document.body.classList.add('shake');
        setTimeout(() => document.body.classList.remove('shake'), 400);
      } catch (e) {
        toast('Erro', 'error');
      } finally {
        showLoading(false);
      }
    }

    async function rejectConfirm(desireId) {
      const desire = game.desires.find(d => d.id === desireId);
      if (!desire || desire.status !== 'pending_confirm') return;

      const fulfiller = desire.confirmRequestedBy;

      showLoading(true);
      try {
        // Back to active (still has time)
        desire.status = 'active';
        desire.confirmRequestedBy = null;
        desire.confirmRequestedAt = null;
        game = await saveGame(game);
        toast('Confirmação recusada. O desejo continua ativo.', 'error');
        renderView();
      } catch (e) {
        toast('Erro', 'error');
      } finally {
        showLoading(false);
      }
    }

    // ========== INIT ==========
    document.addEventListener('DOMContentLoaded', () => {
      // Enter key on login
      $('password').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') doLogin();
      });
      $('username').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') $('password').focus();
      });

      // Auto login if saved
      const saved = localStorage.getItem('desejos_user');
      if (saved && CREDENTIALS[saved]) {
        currentUser = saved;
        startApp();
      }
    });

    // Close modal on overlay click
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeModal(overlay.id);
      });
    });

    // PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('SW registered', reg.scope))
          .catch((err) => console.log('SW failed', err));
      });
    }
  </script>
</body>
</html>
